name: 03-Deployment (Automated Distribution)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  release:
    name: Package Release & Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Archive Artifacts (Zip)
        run: |
          mkdir -p dist
          for dir in release-artifacts/*/; do
            dirname=$(basename "$dir")
            echo "Compressing $dirname..."
            zip -r "dist/${dirname}.zip" "$dir"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Cloud Storage / CDN Bucket (S3 Hook)
        run: |
          echo "Simulating S3 / Itch.io / Meta Horizon Alpha Track push..."
          echo "Artifacts ready in dist/ directory for automated deployment."
