name: "00 - Acquire Unity License (.alf)"

on:
  workflow_dispatch:

jobs:
  acquire_alf:
    name: Generate .alf Activation File
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Request Activation File
        uses: game-ci/unity-request-activation-file@v2
        id: get_alf
        with:
          unityVersion: "6000.4.5f1"

      - name: Upload .alf as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_Activation_File
          path: ${{ steps.get_alf.outputs.filePath }}
          retention-days: 1
