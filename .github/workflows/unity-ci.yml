name: Unity CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  UNITY_VERSION: "6000.4.5f1"

jobs:
  unity-test-and-build:
    name: Run Unit Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Unity CLI
        run: |
          curl -s https://unity-cli.install.sh | bash
          # Ensure directory exists and check binary location
          ls -la ~/.local/bin/

      - name: Verify CLI Installation
        run: |
          ~/.local/bin/unity --version

      - name: Install Unity Editor
        run: |
          ~/.local/bin/unity install --version ${{ env.UNITY_VERSION }} --yes --accept-eula

      - name: Activate Unity License
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          EDITOR_PATH=$(~/.local/bin/unity editors --json | jq -r '.[0].path')
          
          "$EDITOR_PATH" -quit -batchmode \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" || true

      - name: Run Unit Tests
        run: |
          ~/.local/bin/unity test --mode EditMode --output test-results.xml

      - name: Save Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: test-results.xml

      - name: Build Project
        run: |
          ~/.local/bin/unity build --build-target StandaloneLinux64 --output-path ./Builds/Linux/Game.x86_64